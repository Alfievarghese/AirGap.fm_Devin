<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- AirGap.fm Signature Squircle Badge -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#f5f3ec" stroke="#dfdbd0" stroke-width="3.5"/>
  <rect x="12" y="12" width="104" height="104" rx="22" fill="#f03e18"/>
  <defs>
    <linearGradient id="airgap-shade" x1="64" y1="64" x2="64" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect x="12" y="64" width="104" height="52" rx="22" fill="url(#airgap-shade)"/>
  <!-- Air-Gap Acoustic Broadcast Waves -->
  <path d="M 38 42 A 26 26 0 0 1 90 42" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M 28 32 A 40 40 0 0 1 100 32" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 20 22 A 52 52 0 0 1 108 22" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Dual Air-Gapped Transceiver Nodes -->
  <circle cx="44" cy="68" r="8" fill="#ffffff"/>
  <circle cx="84" cy="68" r="8" fill="#ffffff"/>
  <!-- Acoustic Bridge Pulse -->
  <circle cx="64" cy="68" r="4.5" fill="#f5f3ec"/>
  <line x1="52" y1="68" x2="76" y2="68" stroke="#ffffff" stroke-width="3.5" stroke-dasharray="2 3" stroke-linecap="round"/>
  <!-- Subtitle FM Frequency Mark -->
  <text x="64" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" letter-spacing="2.5" text-anchor="middle" opacity="0.95">FM</text>
</svg>